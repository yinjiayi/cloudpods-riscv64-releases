name: Publish native-build source assets to Pages

on:
  workflow_dispatch:
  push:
    tags:
      - 'source-assets-pages-*'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pinned KVM-validated RPM build
        id: attestation
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f rpm/kvm-validation.env ]]; then
            echo 'available=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          source rpm/kvm-validation.env
          [[ ${RPM_BUILD_RUN_ID} =~ ^[0-9]+$ ]]
          [[ ${QEMU_RPM_SHA256} =~ ^[0-9a-f]{64}$ ]]
          echo 'available=true' >> "${GITHUB_OUTPUT}"
          echo "build_run_id=${RPM_BUILD_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "qemu_rpm_sha256=${QEMU_RPM_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Download the pinned validated RPM site
        if: steps.attestation.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cloudpods-openeuler-24.03-sp3-riscv64-rpms
          path: validated
          run-id: ${{ steps.attestation.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Match the physical-host KVM attestation
        if: steps.attestation.outputs.available == 'true'
        shell: bash
        env:
          EXPECTED_QEMU_SHA256: ${{ steps.attestation.outputs.qemu_rpm_sha256 }}
        run: |
          set -Eeuo pipefail
          mapfile -t qemu_rpms < <(
            find validated/dist/rpm/riscv64 -maxdepth 1 -type f \
              -name 'qemu-riscv-cloudpods-*.riscv64.rpm' | sort
          )
          [[ ${#qemu_rpms[@]} -eq 1 ]]
          echo "${EXPECTED_QEMU_SHA256}  ${qemu_rpms[0]}" | sha256sum --check
          (
            cd validated/site/rpm/openEuler/24.03-LTS-SP3/riscv64
            sha256sum --check SHA256SUMS
          )

      - name: Download and verify pinned source assets
        shell: bash
        env:
          HAS_VALIDATED_RPMS: ${{ steps.attestation.outputs.available }}
        run: |
          set -Eeuo pipefail
          source versions.env
          install -d -m 0755 site
          if [[ ${HAS_VALIDATED_RPMS} == true ]]; then
            cp -a validated/site/. site/
            cp pages/rpm-index.html \
              site/rpm/openEuler/24.03-LTS-SP3/riscv64/index.html
          fi
          release_base=https://github.com/yinjiayi/cloudpods-riscv64-releases/releases/download/${CLOUDPODS_SOURCE_ASSET_TAG}
          install -d -m 0755 site/source-assets
          for asset in "${CLOUDPODS_SOURCE_ARCHIVE}" "${OCBOOT_SOURCE_ARCHIVE}"; do
            curl --fail --location --retry 10 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              "${release_base}/${asset}" \
              --output "site/source-assets/${asset}"
          done
          cp source-assets/SHA256SUMS source-assets/index.html \
            site/source-assets/
          cp pages/index.html site/index.html
          (
            cd site/source-assets
            sha256sum --check SHA256SUMS
          )

      - name: Preserve checksum-verified K3s RISC-V release assets on Pages
        shell: bash
        run: ./scripts/stage-k3s-pages-assets.sh site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: stage
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
