name: Build openEuler RISC-V RPMs

on:
  workflow_dispatch:
  push:
    tags:
      - 'rpm-riscv64-*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, riscv64, openeuler-24.03-riscv64]
    timeout-minutes: 360
    outputs:
      rpm_bundle_image: ${{ steps.publish-bundle.outputs.image }}
    steps:
      - name: Fetch pinned workflow source with native curl
        shell: bash
        run: |
          set -Eeuo pipefail
          source_root=${RUNNER_TEMP}/cloudpods-riscv64-releases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          source_archive=${source_root}.tar.gz
          install -d -m 0755 "${source_root}"
          curl --fail --location --retry 10 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            --output "${source_archive}" \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tar -C "${source_root}" --strip-components=1 -xzf "${source_archive}"
          test -x "${source_root}/rpm/build-all.sh"
          echo "RELEASE_SOURCE_ROOT=${source_root}" >> "${GITHUB_ENV}"

      - name: Install build dependencies
        run: |
          sudo dnf install -y \
            buildah createrepo_c dnf-plugins-core file git gnupg2 ninja-build \
            libxml2 rpm-build rpmdevtools skopeo xz
          # Some optional accelerators are not published for riscv64 in the
          # openEuler repositories (for example intel-qpl and qatzip).  QEMU
          # and Open vSwitch build correctly without those optional features.
          sudo dnf builddep -y --skip-unavailable qemu
          sudo dnf builddep -y --skip-unavailable "${OPENVSWITCH_SRPM_URL}"
        env:
          OPENVSWITCH_SRPM_URL: https://mirror.iscas.ac.cn/openeuler/openEuler-24.03-LTS-SP3/update/source/Packages/openvswitch-3.2.1-5.oe2403sp3.src.rpm

      - name: Build RPM repository
        run: "${RELEASE_SOURCE_ROOT}/rpm/build-all.sh"
        env:
          CLOUDPODS_SOURCE_CACHE_DIR: /var/cache/cloudpods-build
          QEMU_KVM_SMOKE: skip

      - name: Publish the unvalidated RPM bundle to GHCR
        id: publish-bundle
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          bundle_image=ghcr.io/yinjiayi/cloudpods-rpm-build:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          printf '%s' "${GHCR_TOKEN}" | buildah login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          buildah bud \
            --arch riscv64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --file "${RELEASE_SOURCE_ROOT}/rpm/Containerfile.artifact" \
            --tag "${bundle_image}" \
            "${RELEASE_SOURCE_ROOT}"
          buildah push "${bundle_image}" "docker://${bundle_image}"
          echo "image=${bundle_image}" >> "${GITHUB_OUTPUT}"

  export-artifact:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Export the exact GHCR bundle
        env:
          BUNDLE_IMAGE: ${{ needs.build.outputs.rpm_bundle_image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${BUNDLE_IMAGE}"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          docker pull --platform linux/riscv64 "${BUNDLE_IMAGE}"
          container_id=$(docker create --platform linux/riscv64 "${BUNDLE_IMAGE}")
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          install -d -m 0755 validated
          docker cp "${container_id}:/artifact/." validated/
          test -f validated/dist/rpm/riscv64/SHA256SUMS
          test -d validated/site/rpm/openEuler/24.03-LTS-SP3/riscv64/repodata
          (
            cd validated/dist/rpm/riscv64
            sha256sum --check SHA256SUMS
          )

      - name: Upload unvalidated RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudpods-openeuler-24.03-sp3-riscv64-rpms
          if-no-files-found: error
          retention-days: 14
          path: |
            validated/dist/rpm/riscv64
            validated/site
