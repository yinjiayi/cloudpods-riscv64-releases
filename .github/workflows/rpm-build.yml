name: Build openEuler RISC-V RPMs

on:
  workflow_dispatch:
  push:
    tags:
      - 'rpm-riscv64-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, riscv64, openeuler-24.03-riscv64]
    timeout-minutes: 360
    steps:
      - name: Fetch pinned workflow source with native curl
        shell: bash
        run: |
          set -Eeuo pipefail
          source_root=${RUNNER_TEMP}/cloudpods-riscv64-releases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          source_archive=${source_root}.tar.gz
          install -d -m 0755 "${source_root}"
          curl --fail --location --retry 10 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            --output "${source_archive}" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
          tar -C "${source_root}" --strip-components=1 -xzf "${source_archive}"
          test -x "${source_root}/rpm/build-all.sh"
          echo "RELEASE_SOURCE_ROOT=${source_root}" >> "${GITHUB_ENV}"

      - name: Install build dependencies
        run: |
          sudo dnf install -y \
            buildah createrepo_c dnf-plugins-core file git gnupg2 ninja-build \
            rpm-build rpmdevtools skopeo xz
          sudo dnf builddep -y qemu
          sudo dnf builddep -y "${OPENVSWITCH_SRPM_URL}"
        env:
          OPENVSWITCH_SRPM_URL: https://mirror.iscas.ac.cn/openeuler/openEuler-24.03-LTS-SP3/update/source/Packages/openvswitch-3.2.1-5.oe2403sp3.src.rpm

      - name: Build RPM repository
        run: "${RELEASE_SOURCE_ROOT}/rpm/build-all.sh"
        env:
          QEMU_KVM_SMOKE: skip

      - name: Upload unvalidated RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudpods-openeuler-24.03-sp3-riscv64-rpms
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/cloudpods-riscv64-releases-${{ github.run_id }}-${{ github.run_attempt }}/dist/rpm/riscv64
            ${{ runner.temp }}/cloudpods-riscv64-releases-${{ github.run_id }}-${{ github.run_attempt }}/site
