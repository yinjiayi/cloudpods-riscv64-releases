name: Build and publish ocboot RISC-V image

on:
  workflow_dispatch:
  push:
    tags:
      - 'ocboot-image-riscv64-*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, cloudpods-riscv64-qemu]
    timeout-minutes: 120
    steps:
      - name: Fetch pinned workflow source with native curl
        shell: bash
        run: |
          set -Eeuo pipefail
          source_root=${RUNNER_TEMP}/cloudpods-riscv64-releases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          source_archive=${source_root}.tar.gz
          source_cache_dir=/var/cache/cloudpods-build
          source_cache=${source_cache_dir}/release-source-${GITHUB_SHA}.tar.gz
          source_cache_sha=${source_cache}.sha256
          install -d -m 0755 "${source_root}"
          if [[ -f ${source_cache} && -f ${source_cache_sha} ]] && \
              sha256sum --check --status "${source_cache_sha}" && \
              tar -tzf "${source_cache}" >/dev/null; then
            echo "Using verified release-source cache: ${source_cache}"
            install -m 0644 "${source_cache}" "${source_archive}"
          else
            curl --fail --location --retry 10 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              --output "${source_archive}" \
              "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
            tar -tzf "${source_archive}" >/dev/null
            install -d -m 0755 "${source_cache_dir}"
            cache_tmp=$(mktemp "${source_cache}.XXXXXX")
            install -m 0644 "${source_archive}" "${cache_tmp}"
            mv "${cache_tmp}" "${source_cache}"
            cache_sha_tmp=$(mktemp "${source_cache_sha}.XXXXXX")
            sha256sum "${source_cache}" > "${cache_sha_tmp}"
            mv "${cache_sha_tmp}" "${source_cache_sha}"
          fi
          tar -C "${source_root}" --strip-components=1 -xzf "${source_archive}"
          test -f "${source_root}/versions.env"
          echo "RELEASE_SOURCE_ROOT=${source_root}" >> "${GITHUB_ENV}"

      - name: Fetch and verify the pinned ocboot source asset
        shell: bash
        run: |
          set -Eeuo pipefail
          source "${RELEASE_SOURCE_ROOT}/versions.env"
          asset_root=${RUNNER_TEMP}/ocboot-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          source_archive=${asset_root}/${OCBOOT_SOURCE_ARCHIVE}
          source_archive_part=${source_archive}.part
          release_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${CLOUDPODS_SOURCE_ASSET_TAG}/${OCBOOT_SOURCE_ARCHIVE}
          pages_url=${SOURCE_ASSET_PAGE_BASE_URL}/${OCBOOT_SOURCE_ARCHIVE}
          install -d -m 0755 "${asset_root}/src"
          if ! curl --fail --location --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              "${release_url}" --output "${source_archive_part}"; then
            rm -f "${source_archive_part}"
            curl --fail --location --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              "${pages_url}" --output "${source_archive_part}"
          fi
          mv "${source_archive_part}" "${source_archive}"
          echo "${OCBOOT_SOURCE_ARCHIVE_SHA256}  ${source_archive}" | \
            sha256sum --check
          tar -C "${asset_root}/src" --strip-components=1 \
            -xzf "${source_archive}"
          test -f "${asset_root}/src/Dockerfile.riscv64"
          test -x "${asset_root}/src/ocboot.sh"
          echo "OCBOOT_SOURCE_ROOT=${asset_root}/src" >> "${GITHUB_ENV}"

      - name: Build and publish the native RISC-V image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          source "${RELEASE_SOURCE_ROOT}/versions.env"
          image=ghcr.io/yinjiayi/ocboot:${OCBOOT_VERSION}
          verifier=ocboot-image-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          cleanup() {
            buildah rm "${verifier}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          test "$(uname -m)" = x86_64
          test -r /proc/sys/fs/binfmt_misc/qemu-riscv64
          grep -Fxq enabled /proc/sys/fs/binfmt_misc/qemu-riscv64
          printf '%s' "${GHCR_TOKEN}" | buildah login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

          built=false
          if metadata=$(skopeo inspect --override-os linux --override-arch riscv64 \
              "docker://${image}" 2>/dev/null) && \
              test "$(jq -r .Architecture <<<"${metadata}")" = riscv64 && \
              test "$(jq -r '.Labels["org.opencontainers.image.revision"] // ""' \
                <<<"${metadata}")" = "${OCBOOT_SOURCE_COMMIT}"; then
            echo "Reusing published image for ${OCBOOT_SOURCE_COMMIT}: ${image}"
            buildah pull --arch riscv64 "${image}"
          else
            buildah bud \
              --arch riscv64 \
              --network host \
              --label "org.opencontainers.image.source=https://github.com/yinjiayi/ocboot" \
              --label "org.opencontainers.image.revision=${OCBOOT_SOURCE_COMMIT}" \
              --file "${OCBOOT_SOURCE_ROOT}/Dockerfile.riscv64" \
              --tag "${image}" "${OCBOOT_SOURCE_ROOT}"
            built=true
          fi
          test "$(buildah inspect --format '{{.OCIv1.Architecture}}' "${image}")" = riscv64
          buildah from --name "${verifier}" "${image}" >/dev/null
          buildah run "${verifier}" -- sh -ec '
            test "$(uname -m)" = riscv64
            test "${K3S_AIRGAP_DIR}" = /ocboot/airgap_assets
            python3 --version
            ansible --version
          '
          if test "${built}" = true; then
            buildah push "${image}" "docker://${image}"
          fi

  verify-public:
    needs: build
    if: ${{ always() }}
    runs-on: [self-hosted, Linux, X64, cloudpods-riscv64-qemu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify anonymous RISC-V pull
        run: |
          set -Eeuo pipefail
          source versions.env
          command -v jq
          command -v skopeo
          metadata=$(skopeo inspect --no-creds \
            --override-os linux --override-arch riscv64 \
            "docker://ghcr.io/yinjiayi/ocboot:${OCBOOT_VERSION}")
          test "$(jq -r .Architecture <<<"${metadata}")" = riscv64
          test "$(jq -r '.Labels["org.opencontainers.image.revision"] // ""' \
            <<<"${metadata}")" = "${OCBOOT_SOURCE_COMMIT}"
          jq -r .Digest <<<"${metadata}" | grep -Eq '^sha256:[0-9a-f]{64}$'
