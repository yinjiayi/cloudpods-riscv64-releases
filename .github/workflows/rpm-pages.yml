name: Publish KVM-validated RISC-V RPMs to Pages

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Workflow run ID from Build openEuler RISC-V RPMs
        required: true
        type: string
      qemu_rpm_sha256:
        description: KVM_VALIDATION_SHA256 from the physical RISC-V host
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  validate-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the exact validated build artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudpods-openeuler-24.03-sp3-riscv64-rpms
          path: validated
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Match the physical-host KVM attestation
        shell: bash
        env:
          EXPECTED_QEMU_SHA256: ${{ inputs.qemu_rpm_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ ${EXPECTED_QEMU_SHA256} =~ ^[0-9a-f]{64}$ ]]
          mapfile -t qemu_rpms < <(
            find validated/dist/rpm/riscv64 -maxdepth 1 -type f \
              -name 'qemu-riscv-cloudpods-*.riscv64.rpm' | sort
          )
          [[ ${#qemu_rpms[@]} -eq 1 ]]
          echo "${EXPECTED_QEMU_SHA256}  ${qemu_rpms[0]}" | sha256sum --check
          cd validated/site/rpm/openEuler/24.03-LTS-SP3/riscv64
          sha256sum --check SHA256SUMS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: validated/site

  deploy:
    needs: validate-artifact
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
