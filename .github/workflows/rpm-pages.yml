name: Publish KVM-validated RISC-V RPMs to Pages

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Workflow run ID from Build openEuler RISC-V RPMs
        required: true
        type: string
      qemu_rpm_sha256:
        description: KVM_VALIDATION_SHA256 from the physical RISC-V host
        required: true
        type: string
  push:
    tags:
      - 'rpm-pages-riscv64-*'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the physical-host KVM attestation
        id: attestation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          INPUT_QEMU_SHA256: ${{ inputs.qemu_rpm_sha256 }}
        run: |
          set -Eeuo pipefail
          if [[ ${EVENT_NAME} == workflow_dispatch ]]; then
            build_run_id=${INPUT_BUILD_RUN_ID}
            qemu_rpm_sha256=${INPUT_QEMU_SHA256}
          else
            test -f rpm/kvm-validation.env
            build_run_id=$(sed -n 's/^RPM_BUILD_RUN_ID=//p' \
              rpm/kvm-validation.env)
            qemu_rpm_sha256=$(sed -n 's/^QEMU_RPM_SHA256=//p' \
              rpm/kvm-validation.env)
          fi
          [[ ${build_run_id} =~ ^[0-9]+$ ]]
          [[ ${qemu_rpm_sha256} =~ ^[0-9a-f]{64}$ ]]
          echo "build_run_id=${build_run_id}" >> "${GITHUB_OUTPUT}"
          echo "qemu_rpm_sha256=${qemu_rpm_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Download the exact validated build artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudpods-openeuler-24.03-sp3-riscv64-rpms
          path: validated
          run-id: ${{ steps.attestation.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Match the physical-host KVM attestation
        shell: bash
        env:
          EXPECTED_QEMU_SHA256: ${{ steps.attestation.outputs.qemu_rpm_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ ${EXPECTED_QEMU_SHA256} =~ ^[0-9a-f]{64}$ ]]
          mapfile -t qemu_rpms < <(
            find validated/dist/rpm/riscv64 -maxdepth 1 -type f \
              -name 'qemu-riscv-cloudpods-*.riscv64.rpm' | sort
          )
          [[ ${#qemu_rpms[@]} -eq 1 ]]
          echo "${EXPECTED_QEMU_SHA256}  ${qemu_rpms[0]}" | sha256sum --check
          cd validated/site/rpm/openEuler/24.03-LTS-SP3/riscv64
          sha256sum --check SHA256SUMS

      - name: Preserve pinned source assets on Pages
        shell: bash
        run: |
          set -Eeuo pipefail
          source versions.env
          source_site=validated/site/source-assets
          release_base=https://github.com/yinjiayi/cloudpods-riscv64-releases/releases/download/${CLOUDPODS_SOURCE_ASSET_TAG}
          install -d -m 0755 "${source_site}"
          for asset in "${CLOUDPODS_SOURCE_ARCHIVE}" "${OCBOOT_SOURCE_ARCHIVE}"; do
            curl --fail --location --retry 10 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              "${release_base}/${asset}" --output "${source_site}/${asset}"
          done
          cp source-assets/SHA256SUMS source-assets/index.html "${source_site}/"
          cp pages/index.html validated/site/index.html
          cp pages/rpm-index.html \
            validated/site/rpm/openEuler/24.03-LTS-SP3/riscv64/index.html
          (
            cd "${source_site}"
            sha256sum --check SHA256SUMS
          )

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: validated/site

  deploy:
    needs: validate-artifact
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
