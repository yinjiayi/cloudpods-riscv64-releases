name: Build K3s RISC-V images

on:
  workflow_dispatch:
  push:
    tags:
      - 'images-riscv64-*'

permissions:
  contents: read
  packages: write

jobs:
  mirror-build-bases:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install registry copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Mirror pinned K3s build bases to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          source versions.env
          printf '%s' "${GHCR_TOKEN}" | skopeo login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

          mirror_image() {
            local architecture=$1
            local source_image=$2
            local target_image=$3

            skopeo copy --retry-times 5 \
              --override-os linux --override-arch "${architecture}" \
              "docker://${source_image}" "docker://${target_image}"
            test "$(skopeo inspect --override-os linux \
              --override-arch "${architecture}" \
              --format '{{.Architecture}}' "docker://${target_image}")" \
              = "${architecture}"
          }

          mirror_image amd64 \
            docker.io/library/golang@sha256:7cc3189dae5bcd44531e89cc958eec136e6a2f3aa6d5fc84c61b73fa25727c13 \
            ${GHCR_NAMESPACE}/k3s-golang-cross:1.20.12-alpine3.18-amd64.1
          mirror_image riscv64 \
            docker.io/library/alpine@${ALPINE_RISCV64_DIGEST} \
            ${GHCR_NAMESPACE}/k3s-alpine:3.20-riscv64.1
          mirror_image riscv64 \
            docker.io/library/golang@${GOLANG_1_23_RISCV64_DIGEST} \
            ${GHCR_NAMESPACE}/k3s-golang:1.23-alpine3.20-riscv64.1
          mirror_image riscv64 \
            docker.io/riscv64/busybox@${BUSYBOX_RISCV64_DIGEST} \
            ${GHCR_NAMESPACE}/k3s-busybox:${BUSYBOX_VERSION}-riscv64.1
          mirror_image riscv64 \
            ghcr.io/go-riscv/distroless/static-unstable@${DISTROLESS_STATIC_RISCV64_DIGEST} \
            ${GHCR_NAMESPACE}/k3s-distroless-static:unstable-riscv64.1
          mirror_image riscv64 \
            registry.cn-beijing.aliyuncs.com/yunionio/alpine-build@${CLOUDPODS_ALPINE_BUILD_RISCV64_DIGEST} \
            ${GHCR_NAMESPACE}/cloudpods-alpine-build:3.22.2-go-1.24.9-0-riscv64.1

  build:
    needs: mirror-build-bases
    runs-on: [self-hosted, linux, riscv64, openeuler-24.03-riscv64]
    timeout-minutes: 180
    steps:
      - name: Fetch pinned workflow source with native curl
        shell: bash
        run: |
          set -Eeuo pipefail
          source_root=${RUNNER_TEMP}/cloudpods-riscv64-releases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          source_archive=${source_root}.tar.gz
          install -d -m 0755 "${source_root}"
          curl --fail --location --retry 10 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            --output "${source_archive}" \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tar -C "${source_root}" --strip-components=1 -xzf "${source_archive}"
          test -x "${source_root}/images/build-k3s-images.sh"
          echo "RELEASE_SOURCE_ROOT=${source_root}" >> "${GITHUB_ENV}"

      - name: Build and push images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "${RELEASE_SOURCE_ROOT}/images/build-k3s-images.sh"


  verify-public:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install registry inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo

      - name: Verify anonymous RISC-V pulls and write digest lock
        run: |
          scripts/write-image-digests.sh \
            images/k3s-images.lock \
            dist/k3s-images-riscv64.digests \
            riscv64

      - name: Upload digest lock
        uses: actions/upload-artifact@v4
        with:
          name: k3s-images-riscv64-digests
          if-no-files-found: error
          path: |
            dist/k3s-images-riscv64.digests
            dist/k3s-images-riscv64.digests.sha256
