name: Build and publish Cloudpods RISC-V images

on:
  workflow_dispatch:
  push:
    tags:
      - 'cloudpods-images-riscv64-*'

permissions:
  contents: read
  packages: write

jobs:
  web-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build dashboard from the pinned source
        run: |
          source versions.env
          git clone --depth 1 --branch "${DASHBOARD_SOURCE_REF}" \
            https://github.com/yinjiayi/dashboard.git build-input/dashboard
          test "$(git -C build-input/dashboard rev-parse HEAD)" = \
            "${DASHBOARD_SOURCE_COMMIT}"
          cd build-input/dashboard
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run test:unit -- tests/unit/compute-arch.spec.js --runInBand
          npm run build
          grep -R -q riscv64 dist/js

      - name: Download and verify the pinned K3s RISC-V release
        run: |
          set -Eeuo pipefail
          source versions.env
          release_tag=${K3S_VERSION//+/%2B}
          release_url=https://github.com/yinjiayi/k3s/releases/download/${release_tag}
          install -d -m 0755 build-input/k3s-release
          curl --fail --location --retry 10 --retry-all-errors \
            --output build-input/k3s-release/k3s-riscv64 \
            "${release_url}/k3s-riscv64"
          curl --fail --location --retry 10 --retry-all-errors \
            --output build-input/k3s-release/sha256sum-riscv64.txt \
            "${release_url}/sha256sum-riscv64.txt"
          chmod 0755 build-input/k3s-release/k3s-riscv64
          expected_sha256=$(awk '$2 == "k3s-riscv64" || $2 == "*k3s-riscv64" {print $1}' \
            build-input/k3s-release/sha256sum-riscv64.txt)
          test "${#expected_sha256}" = 64
          echo "${expected_sha256}  build-input/k3s-release/k3s-riscv64" | \
            sha256sum --check
          file build-input/k3s-release/k3s-riscv64 | grep -F 'UCB RISC-V'

      - name: Publish the pinned build assets to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          asset_root=build-input/cloudpods-build-assets
          install -d -m 0755 "${asset_root}/dashboard" "${asset_root}/k3s"
          cp -a build-input/dashboard/dist/. "${asset_root}/dashboard/"
          cp -a build-input/k3s-release/. "${asset_root}/k3s/"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          docker buildx build \
            --platform linux/riscv64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --file images/Containerfile.build-assets \
            --tag "ghcr.io/yinjiayi/cloudpods-build-assets:${GITHUB_SHA}-riscv64" \
            --push "${asset_root}"

  publish:
    needs: web-assets
    runs-on: [self-hosted, linux, riscv64, openeuler-24.03-riscv64]
    timeout-minutes: 240
    steps:
      - name: Fetch pinned workflow source with native curl
        shell: bash
        run: |
          set -Eeuo pipefail
          source_root=${RUNNER_TEMP}/cloudpods-riscv64-releases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          source_archive=${source_root}.tar.gz
          install -d -m 0755 "${source_root}"
          curl --fail --location --retry 10 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            --output "${source_archive}" \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          tar -C "${source_root}" --strip-components=1 -xzf "${source_archive}"
          test -x "${source_root}/images/build-cloudpods-images.sh"
          echo "RELEASE_SOURCE_ROOT=${source_root}" >> "${GITHUB_ENV}"

      - name: Pull pinned build assets from GHCR with native tools
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          assets_image=ghcr.io/yinjiayi/cloudpods-build-assets:${GITHUB_SHA}-riscv64
          assets_container=cloudpods-build-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          assets_root=${RELEASE_SOURCE_ROOT}/build-input
          dashboard_dir=${assets_root}/dashboard-dist
          k3s_dir=${assets_root}/k3s-release
          assets_mount=
          cleanup() {
            if [[ -n ${assets_mount} ]]; then
              buildah unmount "${assets_container}" >/dev/null 2>&1 || true
            fi
            buildah rm "${assets_container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' "${GHCR_TOKEN}" | buildah login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          buildah pull --arch riscv64 "${assets_image}"
          buildah from --name "${assets_container}" "${assets_image}" >/dev/null
          assets_mount=$(buildah mount "${assets_container}")
          install -d -m 0755 "${dashboard_dir}" "${k3s_dir}"
          cp -a "${assets_mount}/assets/dashboard/." "${dashboard_dir}/"
          cp -a "${assets_mount}/assets/k3s/." "${k3s_dir}/"
          test -f "${dashboard_dir}/index.html"
          test -f "${k3s_dir}/k3s-riscv64"
          chmod 0755 "${k3s_dir}/k3s-riscv64"
          echo "DASHBOARD_DIST_DIR=${dashboard_dir}" >> "${GITHUB_ENV}"
          echo "K3S_RELEASE_DIR=${k3s_dir}" >> "${GITHUB_ENV}"

      - name: Build Cloudpods images from pinned source and publish them
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "${RELEASE_SOURCE_ROOT}/images/build-cloudpods-images.sh"

  verify-public:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install registry inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo

      - name: Verify anonymous RISC-V pulls and write digest lock
        run: |
          scripts/write-image-digests.sh \
            images/cloudpods-images.lock \
            dist/cloudpods-images-riscv64.digests \
            riscv64

      - name: Upload digest lock
        uses: actions/upload-artifact@v4
        with:
          name: cloudpods-images-riscv64-digests
          if-no-files-found: error
          path: |
            dist/cloudpods-images-riscv64.digests
            dist/cloudpods-images-riscv64.digests.sha256
