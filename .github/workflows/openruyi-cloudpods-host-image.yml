name: Build openRuyi Cloudpods runtime image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CLOUDPODS_COMMIT: 6359b60d0b5cad7d337990ba966c7e2d106cabb8
  CLOUDPODS_VERSION: v4.0.3-riscv64.9

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout adapted Cloudpods
        uses: actions/checkout@v4
        with:
          repository: yinjiayi/cloudpods
          ref: ${{ env.CLOUDPODS_COMMIT }}
          path: cloudpods

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: cloudpods/go.sum

      - name: Build matching riscv64 Host and Region
        shell: bash
        run: |
          set -euo pipefail
          GOARCH=riscv64 make -C cloudpods cmd/host cmd/region
          for binary in host region; do
            install -D -m 0755 \
              "cloudpods/_output/bin/${binary}" \
              "image-root/rootfs/opt/yunion/bin/${binary}"
            file "image-root/rootfs/opt/yunion/bin/${binary}"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: image-root
          file: images/Containerfile.cloudpods-host-qemu11
          platforms: linux/riscv64
          push: true
          tags: ghcr.io/yinjiayi/cloudpods:${{ env.CLOUDPODS_VERSION }}
          build-args: |
            SOURCE_COMMIT=${{ env.CLOUDPODS_COMMIT }}
            VERSION=${{ env.CLOUDPODS_VERSION }}
