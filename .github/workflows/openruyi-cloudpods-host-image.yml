name: Build openRuyi Cloudpods Host image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CLOUDPODS_COMMIT: 6d7460e50f1d529d85d9e31f2bef456429d4e5ee
  CLOUDPODS_VERSION: v4.0.3-riscv64.7

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout adapted Cloudpods
        uses: actions/checkout@v4
        with:
          repository: yinjiayi/cloudpods
          ref: ${{ env.CLOUDPODS_COMMIT }}
          path: cloudpods

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: cloudpods/go.sum

      - name: Build riscv64 Host
        shell: bash
        run: |
          set -euo pipefail
          GOARCH=riscv64 make -C cloudpods cmd/host
          install -D -m 0755 \
            cloudpods/_output/bin/host \
            image-root/rootfs/opt/yunion/bin/host
          file image-root/rootfs/opt/yunion/bin/host

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: image-root
          file: images/Containerfile.cloudpods-host-qemu11
          platforms: linux/riscv64
          push: true
          tags: ghcr.io/yinjiayi/cloudpods:${{ env.CLOUDPODS_VERSION }}
          build-args: |
            SOURCE_COMMIT=${{ env.CLOUDPODS_COMMIT }}
            VERSION=${{ env.CLOUDPODS_VERSION }}

