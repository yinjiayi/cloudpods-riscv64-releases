apiVersion: v1
kind: Namespace
metadata:
  name: onecloud
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: onecloudclusters.onecloud.yunion.io
spec:
  group: onecloud.yunion.io
  names:
    kind: OnecloudCluster
    listKind: OnecloudClusterList
    plural: onecloudclusters
    singular: onecloudcluster
    shortNames:
      - onecloud
      - oc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Keystone
          type: string
          jsonPath: .spec.keystone.image
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: onecloud-operator
  namespace: onecloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: onecloud-operator
subjects:
  - kind: ServiceAccount
    name: onecloud-operator
    namespace: onecloud
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onecloud-operator
  namespace: onecloud
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: onecloud-operator
  template:
    metadata:
      labels:
        k8s-app: onecloud-operator
    spec:
      serviceAccountName: onecloud-operator
      containers:
        - name: onecloud-operator
          image: localhost/cloudpods/onecloud-operator:v4.0.3-riscv64.3
          imagePullPolicy: Never
          command:
            - /bin/onecloud-controller-manager
            - -disable-init-crd
            - -disable-sync-ingress
            - -sync-user
            - -disable-node-selector-controller
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
